name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (MSVC)
            os: windows-2022
            generator: Visual Studio 17 2022
          - name: Linux (GCC)
            os: ubuntu-24.04
            generator: Ninja

    env:
      # Keeps the Tracktion and JUCE downloads outside build/ so they can be cached
      FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.deps

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev libfreetype-dev \
            libfontconfig1-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libcurl4-openssl-dev xvfb

      - name: Cache Tracktion and JUCE sources
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -B build -G "${{ matrix.generator }}" -DCMAKE_BUILD_TYPE=Debug -DFETCHCONTENT_BASE_DIR="${{ env.FETCHCONTENT_BASE_DIR }}"

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Debug --output-on-failure

      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build -C Debug --output-on-failure
