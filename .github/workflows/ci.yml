name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both build with Ninja so a compiler cache can wrap the compiler: sccache for MSVC,
          # ccache for GCC. JUCE and Tracktion then compile once per cache, not on every run.
          - name: Windows (MSVC)
            os: windows-2022
            cache: sccache
          - name: Linux (GCC)
            os: ubuntu-24.04
            cache: ccache

    env:
      # Keeps the Tracktion and JUCE downloads outside build/ so they can be cached
      FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.deps

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache libasound2-dev libjack-jackd2-dev libfreetype-dev \
            libfontconfig1-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libcurl4-openssl-dev xvfb

      - name: Set up MSVC for Ninja
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: ${{ matrix.cache }}
          key: ${{ matrix.cache }}-${{ runner.os }}
          max-size: 2G

      - name: Cache Tracktion and JUCE sources
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        # Embedded debug info (/Z7) because sccache can't cache MSVC's shared PDB (/Zi).
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DFETCHCONTENT_BASE_DIR="${{ env.FETCHCONTENT_BASE_DIR }}"
          -DNG_COMPILER_LAUNCHER=${{ matrix.cache }}
          -DCMAKE_POLICY_DEFAULT_CMP0141=NEW -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Debug --output-on-failure

      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build -C Debug --output-on-failure
